<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMP 模型管理器</title><link rel="stylesheet" href="/style.css"></head>
<body><link rel="stylesheet" href="/roles.css"><div class="app">
<aside><div class="brand"><span class="brand-icon">o<span>m</span>p</span><div>模型管理器<small>你的模型，随时切换</small></div></div>
<button id="roles-nav" class="nav">◈ <span>Role 配置</span></button><div class="sidebar-label">自定义服务 <button id="add" title="添加服务" aria-label="添加服务">＋</button></div><div id="providers"></div><div class="aside-bottom"><span class="dot"></span> 本机配置 · 直接保存<small id="directory"></small></div></aside>
<main><header><div><span class="crumb">OMP / 配置工作台</span><h1 id="page-title">模型服务</h1></div><div class="header-actions"><button id="reload" class="button secondary">重新加载</button><button id="import" class="button secondary">粘贴配置导入</button></div></header>
<div class="notice"><span>↳</span><p>保存后，新启动的 omp 会使用最新配置。正在运行的会话建议重启后使用。</p></div>
<div id="content"></div><footer><span>配置只保存在这台电脑上</span><span>有改动时自动备份</span></footer></main></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="import-dialog"><form method="dialog"><div class="dialog-head"><h2>粘贴配置，快速接入</h2><button class="icon-button" aria-label="关闭">×</button></div><p>支持 Claude Code 的 env JSON，或单个服务的 JSON 配置。</p><textarea id="import-text" rows="11" placeholder='{"env":{"ANTHROPIC_BASE_URL":"http://127.0.0.1:7864","ANTHROPIC_AUTH_TOKEN":"…","ANTHROPIC_MODEL":"cn:auto"}}' spellcheck="false"></textarea><div id="import-error" class="error" role="alert"></div><div class="dialog-actions"><button class="button secondary">取消</button><button id="parse-import" type="button" class="button primary">填入表单</button></div></form></dialog>
<script>window.MANAGER_TOKEN='__MANAGER_TOKEN__';</script><script type="module" src="/app.js"></script></body></html>
